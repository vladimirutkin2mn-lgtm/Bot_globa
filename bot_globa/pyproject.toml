[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bot-globa"
version = "0.1.0"
description = "Telegram-first platform for a personalized AI oracle"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "alembic>=1.16,<2",
  "astronomy-engine==2.1.19",
  "asyncpg>=0.30,<1",
  "cryptography>=45,<47",
  "fastapi>=0.115,<1",
  "openai>=1.99,<3",
  "pydantic-settings>=2.9,<3",
  "httpx>=0.28,<1",
  "stripe>=12,<15",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "tzdata==2026.3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "pytest-cov>=6.1,<8",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
  "E",     # pycodestyle
  "F",     # pyflakes
  "I",     # import sorting
  "UP",    # pyupgrade
  "B",     # bugbear
  "ASYNC", # blocking calls in async code
  "RUF",   # ruff-specific
  "SIM",   # simplifiable constructs
  "C4",    # comprehensions
  "RET",   # return-flow noise
  "PTH",   # os.path -> pathlib
  "DTZ",   # naive datetimes
  "ERA",   # commented-out code
  "TC006", # cast() targets must be quoted
  "N",     # naming conventions
  "S",     # bandit security rules
  "PLC",
  "PLE",
  "PLW",
]

# Deliberately not selected:
#   ARG      - null-object Protocol implementations must keep the full signature.
#   TC001-3  - FastAPI, pydantic and SQLAlchemy evaluate annotations at runtime, so
#              moving those imports into a TYPE_CHECKING block breaks them.
#   PLR0912/PLR0915 - the codebase still has oversized functions; splitting them is
#              its own change, and enabling the rule now would only add suppressions.
ignore = [
  # `assert x is not None` narrows types for mypy rather than validating input.
  # Converting each one into an explicit invariant error touches billing and privacy
  # paths and belongs in its own reviewed change.
  "S101",
  # The product speaks Russian. Cyrillic in a string literal is the content, not a
  # homoglyph attack, and flagging it only produced 20 file-level suppressions.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests hard-code fixture credentials, build SQL by hand and shell out to alembic;
# they also import inside a test to keep an import-time side effect local to one case.
"tests/**" = ["S", "PLC0415"]
"scripts/**" = ["S603", "S607"]
"tools/**" = ["S603", "S607"]
# Alembic owns revision file names and the generated upgrade/downgrade bodies.
"migrations/**" = ["N999"]
# Modules that are mostly user-facing copy, prompt prose or long column definitions:
# breaking a sentence to hit 100 columns makes it harder to review than the long line is.
"app/api/payments.py" = ["E501"]
"app/bot/group_viral_handlers.py" = ["E501", "PLW0603"]
"app/bot/handlers.py" = ["E501"]
"app/bot/persona_flows.py" = ["E501"]
"app/bot/texts.py" = ["E501"]
"app/db/models.py" = ["E501"]
"app/prompts/*.py" = ["E501"]
"app/services/report_renderer.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "pydantic.Field"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "astronomy"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: tests requiring a real PostgreSQL database"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]