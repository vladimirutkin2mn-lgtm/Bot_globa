services:
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bot_globa
      POSTGRES_USER: bot_globa
      POSTGRES_PASSWORD: bot_globa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot_globa -d bot_globa"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build: .
    env_file: .env
    command: python -m app.cli.release
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000 --reload
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5

  billing-worker:
    build: .
    env_file: .env
    command: python -m app.workers.billing
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  maintenance-worker:
    build: .
    env_file: .env
    command: python -m app.workers.maintenance
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  oracle-memory-worker:
    build: .
    env_file: .env
    command: python -m app.workers.oracle_memory
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  daily-horoscope-worker:
    build: .
    env_file: .env
    command: python -m app.workers.daily_horoscope
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  telegram-worker:
    build: .
    env_file: .env
    command: python -m app.workers.telegram
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    profiles: ["webhook"]
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    env_file: .env
    command: python -m app.bot.main
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./app:/app/app
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
