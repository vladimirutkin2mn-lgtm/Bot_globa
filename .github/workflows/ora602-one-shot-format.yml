name: ORA-602 one-shot format

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-one-shot-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ora-602-cost-quality-observability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Apply formatter and self-delete
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          ruff format \
            app/providers/analytics.py \
            app/services/admin_metrics.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py \
            tests/test_oracle_quality_admin_postgres.py
          cd ..
          git rm .github/workflows/ora602-one-shot-format.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/providers/analytics.py \
            heartsignal/app/services/admin_metrics.py \
            heartsignal/app/services/horoscope_generation.py \
            heartsignal/app/services/reading_generation.py \
            heartsignal/tests/test_oracle_quality_admin_postgres.py
          git commit -m 'ORA-602: apply Ruff formatting'
          git push origin HEAD:agent/ora-602-cost-quality-observability
