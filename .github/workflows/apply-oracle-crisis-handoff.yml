name: Apply oracle crisis handoff integration

on:
  push:
    branches:
      - feat/oracle-crisis-handoffs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Integrate localized handoff before mystical processing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/bot/tarot_handlers.py')
          text = path.read_text()

          text = text.replace(
              'from app.bot.tarot_keyboards import (\n'
              '    TAROT_TOPIC_LABELS,\n'
              '    tarot_context_keyboard,\n'
              '    tarot_full_result_keyboard,\n',
              'from app.bot.tarot_keyboards import (\n'
              '    TAROT_TOPIC_LABELS,\n'
              '    tarot_context_keyboard,\n'
              '    tarot_full_result_keyboard,\n'
              '    tarot_handoff_keyboard,\n',
              1,
          )
          text = text.replace(
              'from app.bot.tarot_renderer import TarotPreviewRenderer\n',
              'from app.bot.tarot_renderer import TarotPreviewRenderer\n'
              'from app.domain.oracle_safety import OracleRiskCategory, OracleSafetyAction\n'
              'from app.services.oracle_crisis_handoff import OracleCrisisHandoffService\n',
              1,
          )
          text = text.replace(
              '    TarotPreviewRequest,\n'
              '    TarotReadingUseCase,\n',
              '    TarotPreviewRequest,\n'
              '    TarotReadingUseCase,\n'
              '    UnsafeTarotInputError,\n',
              1,
          )
          text = text.replace(
              'full_renderer = TarotFullRenderer()\n',
              'full_renderer = TarotFullRenderer()\n'
              'handoff_service = OracleCrisisHandoffService()\n',
              1,
          )

          old = '''    await state.set_state(TarotStates.generating)
    await message.answer(PROCESSING)
    try:
        outcome = await tarot_use_case.create_preview(
            user.id,
            TarotPreviewRequest(topic=topic, question=question, context=context),
        )
    except (LookupError, ValueError):
        await state.clear()
        await message.answer(UNAVAILABLE, reply_markup=tarot_result_keyboard())
        return
    await _deliver(message, state, outcome, tarot_monetized)


async def _deliver(
'''
          new = '''    safety = tarot_use_case.classify_input(question, context)
    if not safety.may_reach_persona_prompt:
        await _send_safety_handoff(
            message,
            state,
            safety.action,
            safety.categories,
            locale=user.telegram_language,
        )
        return
    await state.set_state(TarotStates.generating)
    await message.answer(PROCESSING)
    try:
        outcome = await tarot_use_case.create_preview(
            user.id,
            TarotPreviewRequest(topic=topic, question=question, context=context),
        )
    except UnsafeTarotInputError as error:
        await _send_safety_handoff(
            message,
            state,
            error.action,
            error.categories,
            locale=user.telegram_language,
        )
        return
    except (LookupError, ValueError):
        await state.clear()
        await message.answer(UNAVAILABLE, reply_markup=tarot_result_keyboard())
        return
    await _deliver(message, state, outcome, tarot_monetized)


async def _send_safety_handoff(
    message: Message,
    state: FSMContext,
    action: OracleSafetyAction,
    categories: tuple[OracleRiskCategory, ...],
    *,
    locale: str | None,
) -> None:
    await state.clear()
    handoff = handoff_service.build(action, categories, locale=locale)
    logger.info(
        "oracle_crisis_handoff action=%s categories=%s locale=%s",
        action.value,
        ",".join(category.value for category in categories),
        handoff.locale,
    )
    await message.answer(
        handoff_service.render_text(handoff),
        reply_markup=tarot_handoff_keyboard(),
    )


async def _deliver(
'''
          if old not in text:
              raise SystemExit('tarot generation anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)

          Path('.github/workflows/apply-oracle-crisis-handoff.yml').unlink()
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate localized crisis handoffs in Telegram"
          git push origin "HEAD:${{ github.ref_name }}"
