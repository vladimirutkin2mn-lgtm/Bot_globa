name: Bot Globa CI

on:
  push:
    branches:
      - main
    paths:
      - "bot_globa/**"
      - ".github/workflows/bot-globa-ci.yml"
  pull_request:
    paths:
      - "bot_globa/**"
      - ".github/workflows/bot-globa-ci.yml"

concurrency:
  group: bot-globa-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  # Superseded branch runs are cancelled, but a run on main may already be deploying:
  # cancelling it mid-deploy leaves the host half-updated.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: bot_globa

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_globa_test
          POSTGRES_USER: bot_globa
          POSTGRES_PASSWORD: bot_globa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot_globa -d bot_globa_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://bot_globa:bot_globa@localhost:5432/bot_globa_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: bot_globa/uv.lock

      - name: Fail if uv.lock is out of date with pyproject.toml
        run: uv lock --check

      - name: Install the exact locked dependency set
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check app tests migrations scripts tools

      - name: Lint
        run: uv run ruff check app tests migrations scripts tools

      - name: Type-check
        run: uv run mypy app tests scripts

      - name: Validate Alembic migration chain
        env:
          DATABASE_URL: postgresql+asyncpg://bot_globa:bot_globa@localhost:5432/bot_globa_test
          TELEGRAM_BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CONTENT_ENCRYPTION_KEY: ci-only-key
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Reset test database after migration validation
        run: uv run python scripts/reset_test_database.py

      - name: Verify protected platform invariants
        run: uv run bash scripts/run_platform_invariants.sh --junitxml=platform-invariants-report.xml

      - name: Verify oracle safety regression gate
        run: uv run bash scripts/run_oracle_safety_gate.sh --junitxml=oracle-safety-report.xml

      - name: Verify oracle staging quality gate
        env:
          ORACLE_STAGING_EXPECTED_LLM_PROVIDER: stub
          ORACLE_STAGING_EXPECTED_LLM_MODEL: stub
        run: uv run bash scripts/run_oracle_staging_quality_gate.sh --junitxml=oracle-staging-quality-report.xml

      - name: Verify oracle limited-release controls gate
        run: uv run bash scripts/run_oracle_release_controls_gate.sh --junitxml=oracle-release-controls-report.xml

      - name: Reset test database before oracle quality observability gate
        run: uv run python scripts/reset_test_database.py

      - name: Verify oracle cost and quality observability gate
        run: uv run bash scripts/run_oracle_quality_observability_gate.sh --junitxml=oracle-quality-report.xml

      - name: Reset test database before full suite
        run: uv run python scripts/reset_test_database.py

      - name: Test
        run: uv run pytest --cov --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-globa-test-reports
          path: |
            bot_globa/platform-invariants-report.xml
            bot_globa/oracle-safety-report.xml
            bot_globa/oracle-staging-quality-report.xml
            bot_globa/oracle-release-controls-report.xml
            bot_globa/oracle-quality-report.xml
            bot_globa/pytest-report.xml
            bot_globa/coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag bot-globa:ci .

  deploy:
    # Everything the pipeline checks has to pass before the shared host is touched.
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: bot-globa-deploy-prod
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decide whether deployment is configured
        id: config
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DEPLOY_HOST is not set — skipping deployment. Add the deploy secrets described in docs/runbooks/operating-production.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Load the deploy key
        if: steps.config.outputs.configured == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Pin the host key
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify the host answers before changing anything
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -o BatchMode=yes "${DEPLOY_HOST}" 'echo remote-ok'

      - name: Deploy, migrate and smoke the production stack
        if: steps.config.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/bot_globa' }}
          RUN_SMOKE: "1"
        run: bash tools/deploy_prod_remote.sh
