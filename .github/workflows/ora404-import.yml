name: ORA-404 clean import

on:
  push:
    branches:
      - agent/ora-404-horoscope-persona-retry
    paths:
      - .github/workflows/ora404-import.yml

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Import ORA-404-only paths from legacy stack
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/ora-404-horoscope-persona
          git checkout origin/agent/ora-404-horoscope-persona -- \
            heartsignal/app/bot/main.py \
            heartsignal/app/domain/horoscope.py \
            heartsignal/app/domain/horoscope_topic.py \
            heartsignal/app/prompts/horoscope.py \
            heartsignal/app/services/horoscope_facts.py \
            heartsignal/app/services/horoscope_generation.py \
            heartsignal/app/services/horoscope_reading.py \
            heartsignal/app/services/horoscope_renderer.py \
            heartsignal/app/services/horoscope_result_validator.py \
            heartsignal/app/services/horoscope_storage.py \
            heartsignal/app/services/reading_memory_extraction.py \
            heartsignal/scripts/run_oracle_safety_gate.sh \
            heartsignal/scripts/run_platform_invariants.sh \
            heartsignal/tests/horoscope_helpers.py \
            heartsignal/tests/test_horoscope_facts.py \
            heartsignal/tests/test_horoscope_generation.py \
            heartsignal/tests/test_horoscope_reading.py \
            heartsignal/tests/test_horoscope_reading_postgres.py \
            heartsignal/tests/test_horoscope_renderer.py \
            heartsignal/tests/test_horoscope_result_validator.py \
            heartsignal/tests/test_horoscope_storage.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- \
            heartsignal/app/bot/main.py \
            heartsignal/app/domain/horoscope.py \
            heartsignal/app/domain/horoscope_topic.py \
            heartsignal/app/prompts/horoscope.py \
            heartsignal/app/services/horoscope_facts.py \
            heartsignal/app/services/horoscope_generation.py \
            heartsignal/app/services/horoscope_reading.py \
            heartsignal/app/services/horoscope_renderer.py \
            heartsignal/app/services/horoscope_result_validator.py \
            heartsignal/app/services/horoscope_storage.py \
            heartsignal/app/services/reading_memory_extraction.py \
            heartsignal/scripts/run_oracle_safety_gate.sh \
            heartsignal/scripts/run_platform_invariants.sh \
            heartsignal/tests/horoscope_helpers.py \
            heartsignal/tests/test_horoscope_facts.py \
            heartsignal/tests/test_horoscope_generation.py \
            heartsignal/tests/test_horoscope_reading.py \
            heartsignal/tests/test_horoscope_reading_postgres.py \
            heartsignal/tests/test_horoscope_renderer.py \
            heartsignal/tests/test_horoscope_result_validator.py \
            heartsignal/tests/test_horoscope_storage.py
          git commit -m 'ORA-404: rebuild horoscope persona on clean stack'
          git push origin HEAD:agent/ora-404-horoscope-persona-retry
