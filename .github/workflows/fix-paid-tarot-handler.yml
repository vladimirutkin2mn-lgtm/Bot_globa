name: Fix paid tarot handler

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/paid-tarot-unlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add missing monetization dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/bot/tarot_handlers.py')
          text = path.read_text()
          old = '''async def retry_tarot(
              callback: CallbackQuery,
              state: FSMContext,
              onboarding: OnboardingService,
              tarot_use_case: TarotReadingUseCase,
          ) -> None:'''
          new = '''async def retry_tarot(
              callback: CallbackQuery,
              state: FSMContext,
              onboarding: OnboardingService,
              tarot_use_case: TarotReadingUseCase,
              tarot_monetized: MonetizedReadingService,
          ) -> None:'''
          if old not in text:
              raise SystemExit('retry handler anchor missing')
          path.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-paid-tarot-handler.yml').unlink()
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix paid tarot retry dependency"
          git push origin "HEAD:${{ github.head_ref }}"
