name: ORA-601 formatter

on:
  push:
    branches:
      - agent/ora-601-product-event-taxonomy-retry
    paths:
      - .github/workflows/ora601-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Apply CI formatter to ORA-601 files
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          ruff format \
            app/providers/analytics.py \
            app/services/oracle_product_analytics.py \
            tests/test_oracle_event_taxonomy_postgres.py \
            tests/test_oracle_product_analytics.py \
            tests/test_oracle_service_analytics_postgres.py \
            tests/test_reading_generation_product_analytics.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal
          git commit -m 'ORA-601: apply Ruff formatting'
          git push origin HEAD:agent/ora-601-product-event-taxonomy-retry
