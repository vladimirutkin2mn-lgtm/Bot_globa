name: ORA-602 admin query fix

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-admin-query-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Reuse the same JSON expression in SELECT and GROUP BY
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/services/admin_metrics.py')
          text = path.read_text()
          old = '''            rejection_rows = (
                await session.execute(
                    select(
                        AnalyticsEvent.properties["rejection_reason"].astext,
                        func.count(),
                    )
                    .where(AnalyticsEvent.event_name.in_(_USER_VALIDATION_EVENTS))
                    .group_by(AnalyticsEvent.properties["rejection_reason"].astext)
                )
            ).all()
'''
          new = '''            rejection_reason = AnalyticsEvent.properties["rejection_reason"].astext
            rejection_rows = (
                await session.execute(
                    select(rejection_reason, func.count())
                    .where(AnalyticsEvent.event_name.in_(_USER_VALIDATION_EVENTS))
                    .group_by(rejection_reason)
                )
            ).all()
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one rejection query block, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cd heartsignal
          ruff format app/services/admin_metrics.py
          ruff check app/services/admin_metrics.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/services/admin_metrics.py
          git rm .github/workflows/ora602-admin-query-fix.yml
          git commit -m 'ORA-602: make rejection aggregation PostgreSQL-safe'
          git push origin HEAD:agent/ora-602-cost-quality-observability
