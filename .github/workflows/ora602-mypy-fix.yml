name: ORA-602 mypy fix

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-mypy-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix typed quality aggregation and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/services/admin_metrics.py')
          text = path.read_text()

          def once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match for {old[:90]!r}; got {text.count(old)}')
              text = text.replace(old, new, 1)

          once(
              'from collections.abc import Iterable\nfrom dataclasses import dataclass, field\n',
              'from collections.abc import Iterable, Mapping\n'
              'from dataclasses import dataclass, field\n'
              'from typing import Any\n',
          )
          once(
              '    rows: Iterable[tuple[str, dict[str, object]]],',
              '    rows: Iterable[tuple[str, Mapping[str, str]]],',
          )
          once(
              '        properties = {str(key): str(value) for key, value in raw_properties.items()}\n'
              '        if event_name == LLM_ATTEMPT_EVENT:\n'
              '            key = (',
              '        properties = dict(raw_properties)\n'
              '        if event_name == LLM_ATTEMPT_EVENT:\n'
              '            llm_key = (',
          )
          once(
              '            bucket = llm.setdefault(key, _LLMAccumulator())\n'
              '            bucket.calls += 1\n'
              '            bucket.failed += properties.get("status_code") != "completed"\n'
              '            bucket.repairs += properties.get("attempt_kind") == "repair"\n'
              '            latency = _optional_int(properties.get("latency_ms"))\n'
              '            if latency is not None:\n'
              '                bucket.latency_total += latency\n'
              '                bucket.latency_count += 1\n'
              '            bucket.input_tokens += _int(properties.get("input_tokens"))\n'
              '            bucket.output_tokens += _int(properties.get("output_tokens"))\n'
              '            if properties.get("cost_known") == "true":\n'
              '                bucket.cost_known += 1\n'
              '                bucket.cost += _int(properties.get("estimated_cost_microusd"))',
              '            llm_bucket = llm.setdefault(llm_key, _LLMAccumulator())\n'
              '            llm_bucket.calls += 1\n'
              '            llm_bucket.failed += properties.get("status_code") != "completed"\n'
              '            llm_bucket.repairs += properties.get("attempt_kind") == "repair"\n'
              '            latency = _optional_int(properties.get("latency_ms"))\n'
              '            if latency is not None:\n'
              '                llm_bucket.latency_total += latency\n'
              '                llm_bucket.latency_count += 1\n'
              '            llm_bucket.input_tokens += _int(properties.get("input_tokens"))\n'
              '            llm_bucket.output_tokens += _int(properties.get("output_tokens"))\n'
              '            if properties.get("cost_known") == "true":\n'
              '                llm_bucket.cost_known += 1\n'
              '                llm_bucket.cost += _int(properties.get("estimated_cost_microusd"))',
          )
          once(
              '        elif event_name == ASTROLOGY_EVENT:\n'
              '            key = (',
              '        elif event_name == ASTROLOGY_EVENT:\n'
              '            astrology_key = (',
          )
          once(
              '            bucket = astrology.setdefault(key, _AstrologyAccumulator())\n'
              '            bucket.count += 1\n'
              '            bucket.failed += properties.get("status_code") != "completed"\n'
              '            latency = _optional_int(properties.get("latency_ms"))\n'
              '            if latency is not None:\n'
              '                bucket.latency_total += latency\n'
              '                bucket.latency_count += 1\n'
              '            if failure_code := properties.get("failure_code"):\n'
              '                bucket.failures[failure_code] += 1',
              '            astrology_bucket = astrology.setdefault(\n'
              '                astrology_key, _AstrologyAccumulator()\n'
              '            )\n'
              '            astrology_bucket.count += 1\n'
              '            astrology_bucket.failed += properties.get("status_code") != "completed"\n'
              '            latency = _optional_int(properties.get("latency_ms"))\n'
              '            if latency is not None:\n'
              '                astrology_bucket.latency_total += latency\n'
              '                astrology_bucket.latency_count += 1\n'
              '            if failure_code := properties.get("failure_code"):\n'
              '                astrology_bucket.failures[failure_code] += 1',
          )
          once(
              '        elif event_name == GENERATION_EVENT:\n'
              '            key = (',
              '        elif event_name == GENERATION_EVENT:\n'
              '            generation_key = (',
          )
          once(
              '            bucket = generation.setdefault(key, _GenerationAccumulator())\n'
              '            bucket.count += 1\n'
              '            bucket.attempts_total += _int(properties.get("attempt_count"))\n'
              '            if properties.get("status_code") == "completed":\n'
              '                bucket.completed += 1\n'
              '            else:\n'
              '                bucket.failed += 1\n'
              '            bucket.repairs += properties.get("repair_used") == "true"\n'
              '            if failure_code := properties.get("failure_code"):\n'
              '                bucket.failures[failure_code] += 1',
              '            generation_bucket = generation.setdefault(\n'
              '                generation_key, _GenerationAccumulator()\n'
              '            )\n'
              '            generation_bucket.count += 1\n'
              '            generation_bucket.attempts_total += _int(\n'
              '                properties.get("attempt_count")\n'
              '            )\n'
              '            if properties.get("status_code") == "completed":\n'
              '                generation_bucket.completed += 1\n'
              '            else:\n'
              '                generation_bucket.failed += 1\n'
              '            generation_bucket.repairs += properties.get("repair_used") == "true"\n'
              '            if failure_code := properties.get("failure_code"):\n'
              '                generation_bucket.failures[failure_code] += 1',
          )
          once(
              'def _float_or_none(value: object) -> float | None:',
              'def _float_or_none(value: Any) -> float | None:',
          )
          path.write_text(text)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/services/admin_metrics.py
          git rm .github/workflows/ora602-mypy-fix.yml
          git commit -m 'ORA-602: make quality aggregation mypy-safe'
          git push origin HEAD:agent/ora-602-cost-quality-observability
