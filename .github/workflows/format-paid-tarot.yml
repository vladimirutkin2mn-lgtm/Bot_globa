name: Format paid tarot

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/paid-tarot-unlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Ruff formatting
        shell: bash
        run: |
          python -m pip install 'ruff==0.16.1'
          cd heartsignal
          ruff format \
            app/bot/tarot_full_renderer.py \
            app/bot/tarot_handlers.py \
            app/services/credits_service.py \
            tests/test_reading_paid_access_migration.py
          cd ..
          rm -f heartsignal/.paid-tarot-ci-trigger
          rm -f .github/workflows/format-paid-tarot.yml

      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format paid tarot implementation"
          git push origin "HEAD:${{ github.head_ref }}"
