name: Import canonical RWS 1909 assets

on:
  push:
    branches:
      - agent/canonical-rws1909-tarot

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[rws-assets]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Import original 1909 Commons scans
        run: python bot_globa/scripts/import_rws1909_tarot.py

      - name: Commit imported deck and provenance manifest
        shell: bash
        run: |
          if git diff --quiet -- bot_globa/app/bot/assets/tarot bot_globa/docs/tarot-rws1909-sources.json; then
            echo "Canonical deck already imported"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_globa/app/bot/assets/tarot bot_globa/docs/tarot-rws1909-sources.json
          git commit -m "Import canonical RWS 1909 tarot deck [rws-assets]"
          git push origin HEAD:${{ github.ref_name }}
