name: ORA-602 one-shot Ruff fix

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-one-shot-ruff.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ora-602-cost-quality-observability
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Fix Ruff findings and self-delete
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          python - <<'PY'
          from pathlib import Path
          path = Path('app/services/horoscope_generation.py')
          text = path.read_text()
          old = '''from app.domain.reading_generation import (\n    ReadingGenerationClaim,\n    ReadingGenerationClaimStatus,\n    ReadingGenerationFinalizeStatus,\n)'''
          new = '''from app.domain.reading_generation import (\n    ReadingGenerationClaim,\n    ReadingGenerationClaimStatus,\n    ReadingGenerationContext,\n    ReadingGenerationFinalizeStatus,\n)'''
          if text.count(old) != 1:
              raise SystemExit('expected horoscope reading_generation import block once')
          path.write_text(text.replace(old, new, 1))
          PY
          ruff check \
            app/observability/oracle_quality.py \
            app/services/admin_metrics.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py \
            --fix
          ruff format \
            app/observability/oracle_quality.py \
            app/services/admin_metrics.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py
          ruff check \
            app/observability/oracle_quality.py \
            app/services/admin_metrics.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py
          cd ..
          git rm .github/workflows/ora602-one-shot-ruff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/observability/oracle_quality.py \
            heartsignal/app/services/admin_metrics.py \
            heartsignal/app/services/horoscope_generation.py \
            heartsignal/app/services/reading_generation.py
          git commit -m 'ORA-602: fix Ruff quality observability findings'
          git push origin HEAD:agent/ora-602-cost-quality-observability
