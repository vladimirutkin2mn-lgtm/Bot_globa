name: ORA-602 admin formatter

# One-shot self-cleaning formatter.
on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-admin-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Format admin metrics and remove helper
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          ruff format app/services/admin_metrics.py
          ruff check app/services/admin_metrics.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/services/admin_metrics.py
          git rm .github/workflows/ora602-admin-format.yml
          git commit -m 'ORA-602: format quality metric aggregation'
          git push origin HEAD:agent/ora-602-cost-quality-observability
