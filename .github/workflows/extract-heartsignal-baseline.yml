name: Extract HeartSignal baseline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extract-heartsignal-baseline
  cancel-in-progress: false

jobs:
  extract:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'migration/heartsignal-baseline'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || 'migration/heartsignal-baseline' }}
    steps:
      - name: Check out Bot_globa target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: target

      - name: Check out pinned fabric_bot source
        uses: actions/checkout@v4
        with:
          repository: vladimirutkin2mn-lgtm/fabric_bot
          ref: 9251f2fdfc0678b0544804a1f1655fe5a21ae757
          fetch-depth: 0
          path: source

      - name: Extract project history and import subtree
        shell: bash
        run: |
          set -euo pipefail

          if [ -d target/heartsignal ]; then
            echo "heartsignal/ already exists; nothing to import"
            exit 0
          fi

          git -C source subtree split \
            --prefix=ideas/ai-relationship-platform \
            --branch heartsignal-split

          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target remote add fabric-source "$(pwd)/source"
          git -C target fetch fabric-source heartsignal-split
          git -C target subtree add \
            --prefix=heartsignal \
            fabric-source heartsignal-split \
            -m "Extract HeartSignal baseline from fabric_bot@9251f2f"

          rm -f target/.baseline-trigger
          if ! git -C target diff --quiet || ! git -C target diff --cached --quiet; then
            git -C target add -A
            git -C target commit -m "Remove baseline extraction trigger"
          fi

          git -C target push origin "HEAD:${TARGET_BRANCH}"

      - name: Record extraction provenance
        if: always()
        run: |
          echo "source_repository=vladimirutkin2mn-lgtm/fabric_bot" >> "$GITHUB_STEP_SUMMARY"
          echo "source_commit=9251f2fdfc0678b0544804a1f1655fe5a21ae757" >> "$GITHUB_STEP_SUMMARY"
          echo "source_prefix=ideas/ai-relationship-platform" >> "$GITHUB_STEP_SUMMARY"
          echo "target_prefix=heartsignal" >> "$GITHUB_STEP_SUMMARY"
