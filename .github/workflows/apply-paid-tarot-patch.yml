name: Apply paid tarot patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

concurrency:
  group: apply-paid-tarot-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'feat/paid-tarot-unlock'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair current Telegram test anchor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply_paid_tarot_patch.py')
          text = path.read_text()
          old = """        '''    tarot_context_keyboard,\n    tarot_result_keyboard,\n''',\n        '''    tarot_context_keyboard,\n    tarot_insufficient_keyboard,\n    tarot_result_keyboard,\n''',"""
          new = """        '''    tarot_context_keyboard,\n    tarot_history_keyboard,\n    tarot_result_keyboard,\n''',\n        '''    tarot_context_keyboard,\n    tarot_history_keyboard,\n    tarot_insufficient_keyboard,\n    tarot_result_keyboard,\n''',"""
          if old not in text:
              raise SystemExit('Telegram test anchor repair target missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Apply paid tarot patch
        run: python .github/scripts/apply_paid_tarot_patch.py

      - name: Commit generated feature changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes"
            exit 0
          fi
          git commit -m "Implement paid tarot full unlock"
          git push origin "HEAD:${{ github.head_ref }}"
