name: ORA-405 pytest diagnostics

on:
  push:
    branches:
      - agent/ora-405-product-catalog-retry
    paths:
      - .github/workflows/ora405-diagnose-pytest.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heartsignal
          POSTGRES_USER: heartsignal
          POSTGRES_PASSWORD: heartsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartsignal -d heartsignal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        working-directory: heartsignal
        run: pip install -e '.[dev]'
      - name: Run full pytest and persist failure tail
        working-directory: heartsignal
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+asyncpg://heartsignal:heartsignal@localhost:5432/heartsignal
          TEST_DATABASE_URL: postgresql+asyncpg://heartsignal:heartsignal@localhost:5432/heartsignal
          TELEGRAM_BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CONTENT_ENCRYPTION_KEY: test-only-key
        shell: bash
        run: |
          set +e
          pytest -q 2>&1 | tee /tmp/ora405-pytest.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            printf 'ALL TESTS PASSED\n' > ../ora405-pytest-failure.txt
          else
            tail -n 700 /tmp/ora405-pytest.log > ../ora405-pytest-failure.txt
          fi
      - name: Commit diagnostic tail
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ora405-pytest-failure.txt
          git commit -m 'chore: capture ORA-405 pytest failure tail'
          git push origin HEAD:agent/ora-405-product-catalog-retry
