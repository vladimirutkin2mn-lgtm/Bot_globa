name: ORA-404 lint fixes

on:
  push:
    branches:
      - agent/ora-404-horoscope-persona-retry
    paths:
      - .github/workflows/ora404-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Apply narrow lint fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/domain/horoscope.py')
          text = path.read_text()
          text = text.replace(
              '    r"солнц[еа]|лун[аы]|меркури[йя]|венер[аы]|марс[а]?|юпитер[а]?|сатурн[а]?|"\n',
              '    r"солнц[еа]|лун[аы]|меркури[йя]|венер[аы]|марс[а]?|юпитер[а]?|сатурн[а]?|"  # noqa: RUF001\n',
          )
          text = text.replace(
              '    r"уран[а]?|нептун[а]?|плутон[а]?|овен|телец|близнец(?:ы|ов)|рак|лев|дева|"\n',
              '    r"уран[а]?|нептун[а]?|плутон[а]?|овен|телец|близнец(?:ы|ов)|рак|лев|дева|"  # noqa: RUF001\n',
          )
          text = text.replace(
              '    r"\\b\\d{1,3}(?:[.,]\\d+)?\\s*(?:°|degrees?|deg\\.?|градус(?:а|ов)?)\\b",\n',
              '    r"\\b\\d{1,3}(?:[.,]\\d+)?\\s*(?:°|degrees?|deg\\.?|градус(?:а|ов)?)\\b",  # noqa: RUF001\n',
          )
          path.write_text(text)

          path = Path('heartsignal/app/services/horoscope_renderer.py')
          text = path.read_text()
          text = text.replace('    "mars": "Марс",\n', '    "mars": "Марс",  # noqa: RUF001\n')
          text = text.replace(
              '        "Астрологический текст описывает возможные темы, а не гарантированные события."\n',
              '        "Астрологический текст описывает возможные темы, а не гарантированные события."  # noqa: RUF001\n',
          )
          text = text.replace(
              '            return f"{first} — {aspect} — {second}, орб {orb}"\n',
              '            return f"{first} — {aspect} — {second}, орб {orb}"  # noqa: RUF001\n',
          )
          text = text.replace(
              '            return f"{sample_date}: транзитный {transit} — {aspect} — натальный {natal}, орб {orb}"\n',
              '            return f"{sample_date}: транзитный {transit} — {aspect} — натальный {natal}, орб {orb}"  # noqa: RUF001\n',
          )
          path.write_text(text)

          path = Path('heartsignal/app/prompts/horoscope.py')
          text = path.read_text()
          text = text.replace(
              '        "will display exact labels from the referenced facts. Use multiple possible interpretations "\n',
              '        "will display exact labels from the referenced facts. Use multiple possible "\n'
              '        "interpretations "\n',
          )
          text = text.replace(
              '        "fact_id values. Do not quote or paraphrase raw chart coordinates in narrative text. Include "\n',
              '        "fact_id values. Do not quote or paraphrase raw chart coordinates in narrative text. "\n'
              '        "Include "\n',
          )
          text = text.replace(
              '        "unknown birth time, explicitly preserve the birth_time_unknown limitation and do not infer "\n',
              '        "unknown birth time, explicitly preserve the birth_time_unknown limitation and do not "\n'
              '        "infer "\n',
          )
          text = text.replace(
              '        "houses or an ascendant. Keep the share card free of names, questions, private context, raw "\n',
              '        "houses or an ascendant. Keep the share card free of names, questions, private context, "\n'
              '        "raw "\n',
          )
          path.write_text(text)

          path = Path('heartsignal/tests/horoscope_helpers.py')
          text = path.read_text()
          text = text.replace(
              '                "text": "This pattern may be useful as a prompt to balance initiative with patience.",\n',
              '                "text": (\n'
              '                    "This pattern may be useful as a prompt to balance initiative "\n'
              '                    "with patience."\n'
              '                ),\n',
          )
          path.write_text(text)
          PY
          cd heartsignal
          ruff check --fix tests/test_horoscope_renderer.py
          ruff format app/domain/horoscope.py app/prompts/horoscope.py app/services/horoscope_renderer.py tests/horoscope_helpers.py tests/test_horoscope_renderer.py
          ruff check app/domain/horoscope.py app/prompts/horoscope.py app/services/horoscope_renderer.py tests/horoscope_helpers.py tests/test_horoscope_renderer.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal
          git commit -m 'ORA-404: satisfy Ruff lint rules'
          git push origin HEAD:agent/ora-404-horoscope-persona-retry
