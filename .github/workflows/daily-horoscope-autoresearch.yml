name: Numa daily horoscope autoresearch evaluator

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bot_globa/app/research/**"
      - "bot_globa/scripts/run_daily_horoscope_autoresearch.py"
      - "bot_globa/tests/test_daily_horoscope_autoresearch.py"
      - "bot_globa/autoresearch/daily_horoscope/program.md"
      - ".github/workflows/daily-horoscope-autoresearch.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: bot_globa

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: bot_globa/uv.lock

      - name: Install the exact locked dependency set
        run: uv sync --frozen

      - name: Evaluate research candidate
        run: |
          uv run python scripts/run_daily_horoscope_autoresearch.py \
            --output-dir autoresearch-artifacts

      - name: Publish research summary
        run: cat autoresearch-artifacts/daily-horoscope-autoresearch.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: numa-daily-horoscope-autoresearch-${{ github.run_number }}
          path: |
            bot_globa/autoresearch-artifacts/daily-horoscope-autoresearch.json
            bot_globa/autoresearch-artifacts/daily-horoscope-autoresearch.md
          if-no-files-found: error
          retention-days: 30
