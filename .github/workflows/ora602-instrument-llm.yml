name: ORA-602 LLM instrumentation patch

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-instrument-llm.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instrument oracle LLM requests and production composition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          reading = 'heartsignal/app/services/reading_generation.py'
          replace_once(
              reading,
              '                participant_labels=(),\n            )',
              '                participant_labels=(),\n'
              '                telemetry_persona_code=context.persona_code,\n'
              '                telemetry_prompt_version=context.prompt_version,\n'
              '            )',
          )
          replace_once(
              reading,
              '                        participant_labels=request.participant_labels,\n'
              '                        repair=True,\n'
              '                    )',
              '                        participant_labels=request.participant_labels,\n'
              '                        repair=True,\n'
              '                        telemetry_persona_code=context.persona_code,\n'
              '                        telemetry_prompt_version=context.prompt_version,\n'
              '                    )',
          )

          horoscope = 'heartsignal/app/services/horoscope_generation.py'
          replace_once(
              horoscope,
              '                participant_labels=(),\n            )',
              '                participant_labels=(),\n'
              '                telemetry_persona_code=context.persona_code,\n'
              '                telemetry_prompt_version=context.prompt_version,\n'
              '            )',
          )
          replace_once(
              horoscope,
              '                        participant_labels=request.participant_labels,\n'
              '                        repair=True,\n'
              '                    )',
              '                        participant_labels=request.participant_labels,\n'
              '                        repair=True,\n'
              '                        telemetry_persona_code=context.persona_code,\n'
              '                        telemetry_prompt_version=context.prompt_version,\n'
              '                    )',
          )

          main = 'heartsignal/app/bot/main.py'
          replace_once(
              main,
              'from app.observability.errors import LoggingErrorReporter, NoOpErrorReporter\n'
              'from app.observability.settings import ObservabilitySettings, get_observability_settings\n',
              'from app.observability.errors import LoggingErrorReporter, NoOpErrorReporter\n'
              'from app.observability.oracle_quality import (\n'
              '    LLMCostPolicy,\n'
              '    ObservedLLMClient,\n'
              '    OracleQualityObserver,\n'
              ')\n'
              'from app.observability.settings import ObservabilitySettings, get_observability_settings\n',
          )
          replace_once(
              main,
              '    llm = create_llm_client(settings)\n'
              '    payments = create_payment_components(settings)\n',
              '    raw_llm = create_llm_client(settings)\n'
              '    payments = create_payment_components(settings)\n',
          )
          replace_once(
              main,
              '    oracle_analytics = OracleProductAnalytics(analytics)\n'
              '    reporter = (',
              '    oracle_analytics = OracleProductAnalytics(analytics)\n'
              '    quality_observer = OracleQualityObserver(\n'
              '        analytics,\n'
              '        default_provider=settings.llm_provider,\n'
              '        default_model=settings.llm_model,\n'
              '        cost_policy=LLMCostPolicy(\n'
              '            settings.llm_model,\n'
              '            resolved_observability.llm_input_cost_usd_per_million_tokens,\n'
              '            resolved_observability.llm_output_cost_usd_per_million_tokens,\n'
              '        ),\n'
              '    )\n'
              '    llm = ObservedLLMClient(raw_llm, quality_observer)\n'
              '    reporter = (',
          )
          replace_once(
              main,
              '    dispatcher["oracle_analytics"] = oracle_analytics\n',
              '    dispatcher["oracle_analytics"] = oracle_analytics\n'
              '    dispatcher["oracle_quality_observer"] = quality_observer\n',
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/services/reading_generation.py \
            heartsignal/app/services/horoscope_generation.py \
            heartsignal/app/bot/main.py
          git commit -m 'ORA-602: instrument oracle LLM calls'
          git push origin HEAD:agent/ora-602-cost-quality-observability
