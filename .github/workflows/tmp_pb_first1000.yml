name: TMP PB first 1000

on:
  push:
    branches:
      - tmp/business-activity-enrichment
    paths:
      - 'tmp_business_activity/pb_first1000.py'
      - '.github/workflows/tmp_pb_first1000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pb1000:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run PB fallback
        run: python tmp_business_activity/pb_first1000.py
      - name: Show summary
        if: always()
        run: cat tmp_business_activity/output_pb/summary_pb.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb-first-1000
          path: tmp_business_activity/output_pb/
          if-no-files-found: warn
          retention-days: 1
