name: Repair shared preview renderer typing

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/oracle-free-preview-entitlement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair renderer variable names
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/bot/tarot_handlers.py')
          text = path.read_text()
          replacements = (
              ('            rendered = full_renderer.render(outcome)\n', '            full_rendered = full_renderer.render(outcome)\n'),
              ('            for index, chunk in enumerate(preview_rendered.chunks):\n', '            for index, chunk in enumerate(full_rendered.chunks):\n'),
              ('len(rendered.chunks) - 1', 'len(full_rendered.chunks) - 1'),
              ('            for index, chunk in enumerate(rendered.chunks):\n', '            for index, chunk in enumerate(preview_rendered.chunks):\n'),
          )
          for old, new in replacements:
              if text.count(old) < 1:
                  raise SystemExit(f'missing renderer anchor: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          python -m pip install 'ruff==0.16.1'
          cd heartsignal
          ruff format app/bot/tarot_handlers.py
          cd ..
          rm -f .github/workflows/inspect-free-preview.yml
          rm -f heartsignal/.shared-preview-ci-trigger

      - name: Commit renderer repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair shared preview renderer typing"
          git push origin "HEAD:${{ github.head_ref }}"
