name: Apply shared free preview entitlement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/oracle-free-preview-entitlement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute shared entitlement patch
        shell: bash
        run: |
          python - <<'BOOTSTRAP'
          from pathlib import Path

          source = Path('.github/workflows/apply-shared-free-preview.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n"
          if start_marker not in source or end_marker not in source:
              raise SystemExit('embedded patch markers are missing')
          embedded = source.split(start_marker, 1)[1].split(end_marker, 1)[0]
          body = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in embedded.splitlines()
          )
          exact = '''def replace_once(path: str, old: str, new: str) -> None:
    target = Path(path)
    text = target.read_text()
    if text.count(old) != 1:
        raise SystemExit(f'expected one anchor in {path}: {old[:80]!r}')
    target.write_text(text.replace(old, new, 1))'''
          robust = '''def replace_once(path: str, old: str, new: str) -> None:
    target = Path(path)
    text = target.read_text()
    if text.count(old) == 1:
        target.write_text(text.replace(old, new, 1))
        return
    pattern = re.compile(r"\\s+".join(re.escape(token) for token in old.split()))
    matches = list(pattern.finditer(text))
    if len(matches) != 1:
        raise SystemExit(f"expected one structural anchor in {path}, got {len(matches)}")
    match = matches[0]
    target.write_text(text[: match.start()] + new + text[match.end() :])'''
          if exact not in body:
              raise SystemExit('replace_once definition is missing')
          body = body.replace(exact, robust, 1)
          exec(compile(body, '<shared-preview-patch>', 'exec'))
          BOOTSTRAP
          rm -f heartsignal/.shared-preview-patch-trigger

      - name: Commit shared entitlement implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add shared oracle free preview entitlement"
          git push origin "HEAD:${{ github.head_ref }}"
