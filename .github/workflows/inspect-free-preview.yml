name: Apply shared free preview entitlement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/oracle-free-preview-entitlement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply shared entitlement implementation
        run: python .github/run_shared_preview_patch.py

      - name: Remove temporary patch files
        run: |
          rm -f .github/run_shared_preview_patch.py
          rm -f heartsignal/.shared-preview-patch-trigger

      - name: Commit shared entitlement implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add shared oracle free preview entitlement"
          git push origin "HEAD:${{ github.head_ref }}"
