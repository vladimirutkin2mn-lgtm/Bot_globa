name: Apply oracle input safety integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/oracle-input-safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Integrate safety gate before prompt construction
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/services/reading_generation.py')
          text = path.read_text()

          text = text.replace(
              'from app.domain.reading import ReadingSymbolInput\n',
              'from app.domain.oracle_safety import (\n'
              '    OracleInputSafetyClassifier,\n'
              '    OracleRiskCategory,\n'
              '    OracleSafetyAction,\n'
              '    oracle_safety_limits,\n'
              ')\n'
              'from app.domain.reading import ReadingSymbolInput\n',
              1,
          )
          text = text.replace(
              '    CORRUPTED_RESULT = "corrupted_result"\n',
              '    CORRUPTED_RESULT = "corrupted_result"\n'
              '    SAFETY_HANDOFF = "safety_handoff"\n'
              '    SAFETY_BLOCKED = "safety_blocked"\n',
              1,
          )
          text = text.replace(
              '    model: str | None = None\n',
              '    model: str | None = None\n'
              '    safety_action: OracleSafetyAction | None = None\n'
              '    safety_categories: tuple[OracleRiskCategory, ...] = ()\n',
              1,
          )
          text = text.replace(
              '        validator: ReadingResultValidator | None = None,\n',
              '        validator: ReadingResultValidator | None = None,\n'
              '        safety_classifier: OracleInputSafetyClassifier | None = None,\n',
              1,
          )
          text = text.replace(
              '        self._validator = validator or ReadingResultValidator()\n',
              '        self._validator = validator or ReadingResultValidator()\n'
              '        self._safety = safety_classifier or OracleInputSafetyClassifier()\n',
              1,
          )
          text = text.replace(
              '        context = claim.context\n        attempts = 0\n',
              '        context = claim.context\n'
              '        safety = self._safety.classify(context.question, context.context)\n'
              '        if not safety.may_reach_persona_prompt:\n'
              '            return await self._stop_for_safety(\n'
              '                reading_id, user_id, safety.action, safety.categories\n'
              '            )\n'
              '        attempts = 0\n',
              1,
          )
          text = text.replace(
              '            user_prompt = self._user_prompt(context, symbol_contexts, prompts)\n',
              '            user_prompt = self._user_prompt(context, symbol_contexts, prompts)\n'
              '            limits = oracle_safety_limits(safety.categories)\n'
              '            if limits:\n'
              '                user_prompt = f"{user_prompt}\\n\\nSAFETY_LIMITS:\\n{limits}"\n',
              1,
          )
          anchor = '    async def _fail(\n'
          helper = '''    async def _stop_for_safety(
        self,
        reading_id: UUID,
        user_id: UUID,
        action: OracleSafetyAction,
        categories: tuple[OracleRiskCategory, ...],
    ) -> ReadingGenerationResult:
        failure_code = f"safety_{action.value}_{categories[0].value}"
        finalized = await self._store.fail_generation(reading_id, user_id, failure_code)
        if finalized is ReadingGenerationFinalizeStatus.DELETED:
            return ReadingGenerationResult(ReadingGenerationStatus.DELETED)
        if finalized is ReadingGenerationFinalizeStatus.NOT_FOUND:
            return ReadingGenerationResult(ReadingGenerationStatus.NOT_FOUND)
        status = (
            ReadingGenerationStatus.SAFETY_HANDOFF
            if action is OracleSafetyAction.HANDOFF
            else ReadingGenerationStatus.SAFETY_BLOCKED
        )
        logger.info(
            "reading_generation_safety_stop reading_id=%s action=%s categories=%s",
            reading_id,
            action.value,
            ",".join(category.value for category in categories),
        )
        return ReadingGenerationResult(
            status,
            failure_code=failure_code,
            safety_action=action,
            safety_categories=categories,
        )

'''
          if anchor not in text:
              raise SystemExit('fail helper anchor missing')
          text = text.replace(anchor, helper + anchor, 1)
          path.write_text(text)

          Path('.github/workflows/apply-oracle-input-safety.yml').unlink()
          PY

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate oracle input safety before LLM prompts"
          git push origin "HEAD:${{ github.head_ref }}"
