name: ORA-404 formatter

on:
  push:
    branches:
      - agent/ora-404-horoscope-persona-retry
    paths:
      - .github/workflows/ora404-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Apply CI formatter
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          ruff format \
            app/domain/horoscope.py \
            tests/test_horoscope_facts.py \
            tests/test_horoscope_generation.py \
            tests/test_horoscope_reading_postgres.py \
            tests/test_horoscope_renderer.py \
            tests/test_horoscope_storage.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal
          git commit -m 'ORA-404: apply Ruff formatting'
          git push origin HEAD:agent/ora-404-horoscope-persona-retry
