name: ORA-602 legacy admin metric fix

# One-shot self-cleaning compatibility fix.
on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-legacy-admin-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Preserve legacy technical_total semantics and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/services/admin_metrics.py')
          text = path.read_text()
          old = '        technical_total = failed + jobs.get("manual_review", 0)\n'
          new = '        technical_total = failed\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one technical_total expression, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cd heartsignal
          ruff format app/services/admin_metrics.py
          ruff check app/services/admin_metrics.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/services/admin_metrics.py
          git rm .github/workflows/ora602-legacy-admin-fix.yml
          git commit -m 'ORA-602: preserve legacy admin failure semantics'
          git push origin HEAD:agent/ora-602-cost-quality-observability
