name: ORA-602 horoscope quality patch

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-horoscope-quality.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe astrology calculation and horoscope generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/services/horoscope_generation.py')
          text = path.read_text()

          def once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'horoscope_generation: expected one match for {old[:80]!r}')
              text = text.replace(old, new, 1)

          once('import logging\n', 'import logging\nimport time\n')
          once(
              'from app.domain.horoscope_topic import HoroscopeTopic\n',
              'from app.domain.horoscope_topic import HoroscopeTopic\n'
              'from app.domain.natal_chart import NATAL_CHART_ENGINE_VERSION\n',
          )
          once(
              'from app.prompts.horoscope import (\n',
              'from app.observability.oracle_quality import OracleQualityObserver, elapsed_ms\n'
              'from app.prompts.horoscope import (\n',
          )
          once(
              '        analytics: OracleProductAnalytics | None = None,\n    ) -> None:',
              '        analytics: OracleProductAnalytics | None = None,\n'
              '        quality_observer: OracleQualityObserver | None = None,\n    ) -> None:',
          )
          once(
              '        self._analytics = analytics\n',
              '        self._analytics = analytics\n        self._quality_observer = quality_observer\n',
          )
          once(
              '            facts = await self._facts.calculate_for_user(\n'
              '                user_id,\n'
              '                scope,\n'
              '                reference_date=topic.reference_date,\n'
              '            )',
              '            facts = await self._calculate_facts(\n'
              '                context,\n'
              '                scope,\n'
              '                reference_date=topic.reference_date,\n'
              '            )',
          )
          old_multiline = 'return await self._fail(\n                    reading_id,\n                    user_id,\n'
          if text.count(old_multiline) < 1:
              raise SystemExit('horoscope_generation: expected indented _fail calls')
          text = text.replace(old_multiline, 'return await self._fail_observed(\n                    context,\n')
          old_multiline = 'return await self._fail(\n                reading_id,\n                user_id,\n'
          if text.count(old_multiline) < 1:
              raise SystemExit('horoscope_generation: expected except _fail calls')
          text = text.replace(old_multiline, 'return await self._fail_observed(\n                context,\n')
          text = text.replace(
              'return await self._fail(reading_id, user_id, "llm_timeout", attempts, completion)',
              'return await self._fail_observed(\n'
              '                context, "llm_timeout", attempts, completion\n'
              '            )',
          )
          once(
              '            return HoroscopeGenerationResult(\n'
              '                HoroscopeGenerationStatus.COMPLETED,\n'
              '                result=validated.result,',
              '            await self._observe_generation(\n'
              '                context,\n'
              '                status_code="completed",\n'
              '                attempts=attempts,\n'
              '            )\n'
              '            return HoroscopeGenerationResult(\n'
              '                HoroscopeGenerationStatus.COMPLETED,\n'
              '                result=validated.result,',
          )
          once(
              '    def _ready_result(self, claim: ReadingGenerationClaim) -> HoroscopeGenerationResult:\n',
              '    async def _calculate_facts(\n'
              '        self,\n'
              '        context: ReadingGenerationContext,\n'
              '        scope: HoroscopeScope,\n'
              '        *,\n'
              '        reference_date: date | None,\n'
              '    ) -> HoroscopeFactBundle:\n'
              '        started = time.perf_counter_ns()\n'
              '        try:\n'
              '            facts = await self._facts.calculate_for_user(\n'
              '                context.user_id,\n'
              '                scope,\n'
              '                reference_date=reference_date,\n'
              '            )\n'
              '        except BirthProfileUnavailableError:\n'
              '            await self._observe_astrology(\n'
              '                context,\n'
              '                scope,\n'
              '                engine_version=NATAL_CHART_ENGINE_VERSION,\n'
              '                status_code="failed",\n'
              '                latency_ms=elapsed_ms(started),\n'
              '                failure_code="birth_profile_unavailable",\n'
              '            )\n'
              '            raise\n'
              '        except Exception:\n'
              '            await self._observe_astrology(\n'
              '                context,\n'
              '                scope,\n'
              '                engine_version=NATAL_CHART_ENGINE_VERSION,\n'
              '                status_code="failed",\n'
              '                latency_ms=elapsed_ms(started),\n'
              '                failure_code="astrology_calculation_failed",\n'
              '            )\n'
              '            raise\n'
              '        await self._observe_astrology(\n'
              '            context,\n'
              '            scope,\n'
              '            engine_version=facts.natal_engine_version,\n'
              '            status_code="completed",\n'
              '            latency_ms=elapsed_ms(started),\n'
              '        )\n'
              '        return facts\n\n'
              '    async def _observe_astrology(\n'
              '        self,\n'
              '        context: ReadingGenerationContext,\n'
              '        scope: HoroscopeScope,\n'
              '        *,\n'
              '        engine_version: str,\n'
              '        status_code: str,\n'
              '        latency_ms: int,\n'
              '        failure_code: str | None = None,\n'
              '    ) -> None:\n'
              '        if self._quality_observer is None:\n'
              '            return\n'
              '        await self._quality_observer.astrology(\n'
              '            persona_code=context.persona_code,\n'
              '            scope_code=scope.value,\n'
              '            engine_version=engine_version,\n'
              '            status_code=status_code,\n'
              '            latency_ms=latency_ms,\n'
              '            failure_code=failure_code,\n'
              '        )\n\n'
              '    def _ready_result(self, claim: ReadingGenerationClaim) -> HoroscopeGenerationResult:\n',
          )
          once(
              '    async def _fail(\n',
              '    async def _fail_observed(\n'
              '        self,\n'
              '        context: ReadingGenerationContext,\n'
              '        failure_code: str,\n'
              '        attempts: int,\n'
              '        completion: LLMCompletion | None,\n'
              '    ) -> HoroscopeGenerationResult:\n'
              '        result = await self._fail(\n'
              '            context.reading_id,\n'
              '            context.user_id,\n'
              '            failure_code,\n'
              '            attempts,\n'
              '            completion,\n'
              '        )\n'
              '        if result.status is HoroscopeGenerationStatus.FAILED:\n'
              '            await self._observe_generation(\n'
              '                context,\n'
              '                status_code="failed",\n'
              '                attempts=attempts,\n'
              '                failure_code=failure_code,\n'
              '            )\n'
              '        return result\n\n'
              '    async def _observe_generation(\n'
              '        self,\n'
              '        context: ReadingGenerationContext,\n'
              '        *,\n'
              '        status_code: str,\n'
              '        attempts: int,\n'
              '        failure_code: str | None = None,\n'
              '    ) -> None:\n'
              '        if self._quality_observer is None:\n'
              '            return\n'
              '        await self._quality_observer.generation(\n'
              '            persona_code=context.persona_code,\n'
              '            prompt_version=context.prompt_version,\n'
              '            status_code=status_code,\n'
              '            attempt_count=attempts,\n'
              '            repair_used=attempts > 1,\n'
              '            failure_code=failure_code,\n'
              '        )\n\n'
              '    async def _fail(\n',
          )
          path.write_text(text)

          main = Path('heartsignal/app/bot/main.py')
          main_text = main.read_text()
          old = '            max_repair_attempts=settings.llm_max_repair_attempts,\n            analytics=oracle_analytics,\n        ),'
          if main_text.count(old) != 1:
              raise SystemExit('main: expected one HoroscopeGenerationService construction')
          main.write_text(
              main_text.replace(
                  old,
                  '            max_repair_attempts=settings.llm_max_repair_attempts,\n'
                  '            analytics=oracle_analytics,\n'
                  '            quality_observer=quality_observer,\n'
                  '        ),',
                  1,
              )
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/services/horoscope_generation.py heartsignal/app/bot/main.py
          git commit -m 'ORA-602: observe astrology and horoscope quality'
          git push origin HEAD:agent/ora-602-cost-quality-observability
