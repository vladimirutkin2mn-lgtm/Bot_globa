name: Fix paid tarot regressions

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feat/paid-tarot-unlock'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Update migration heads and close preview regeneration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migration_tests = [
              'heartsignal/tests/test_followup_migration.py',
              'heartsignal/tests/test_fsm_migration.py',
              'heartsignal/tests/test_privacy_migration_data.py',
              'heartsignal/tests/test_reading_migration.py',
              'heartsignal/tests/test_refund_ledger_migration.py',
              'heartsignal/tests/test_release_gate_migration.py',
              'heartsignal/tests/test_subscription_job_migration.py',
              'heartsignal/tests/test_subscription_period_migration.py',
          ]
          head_pattern = re.compile(r'(_HEAD(?:_REVISION)?\s*=\s*)"20260805_17"')
          for name in migration_tests:
              path = Path(name)
              updated, count = head_pattern.subn(
                  r'\1"20260805_18"',
                  path.read_text(),
              )
              if count != 1:
                  raise SystemExit(f'expected one head constant in {name}, got {count}')
              path.write_text(updated)

          domain = Path('heartsignal/app/domain/reading.py')
          transition_pattern = re.compile(
              r'ReadingStatus\.PREVIEW_READY: frozenset\(\s*'
              r'\{ReadingStatus\.GENERATING, ReadingStatus\.FULL_READY, '
              r'ReadingStatus\.DELETED\}\s*\),'
          )
          transition_replacement = (
              'ReadingStatus.PREVIEW_READY: frozenset(\n'
              '        {ReadingStatus.FULL_READY, ReadingStatus.DELETED}\n'
              '    ),'
          )
          updated, count = transition_pattern.subn(
              transition_replacement,
              domain.read_text(),
          )
          if count != 1:
              raise SystemExit(f'expected one preview transition, got {count}')
          domain.write_text(updated)

          history = Path('heartsignal/tests/test_reading_history_postgres.py')
          history_pattern = re.compile(
              r'(topic="other_persona",\s*)'
              r'status=ReadingStatus\.FULL_READY\.value,\s*'
              r'access_level=ReadingAccess\.FULL\.value,'
          )
          history_replacement = (
              r'\1status=ReadingStatus.PREVIEW_READY.value,\n'
              '                access_level=ReadingAccess.PREVIEW.value,'
          )
          updated, count = history_pattern.subn(
              history_replacement,
              history.read_text(),
          )
          if count != 1:
              raise SystemExit(f'expected one history fixture, got {count}')
          history.write_text(updated)

          Path('.github/workflows/fix-paid-tarot-regressions.yml').unlink()
          PY

      - name: Commit regression fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix paid tarot regression contracts"
          git push origin "HEAD:${{ github.head_ref }}"
