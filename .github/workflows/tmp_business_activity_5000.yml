name: TMP business activity first 5000

on:
  push:
    branches:
      - tmp/business-activity-enrichment
    paths:
      - 'tmp_business_activity/enrich_5000.py'
      - 'tmp_business_activity/enrich_chz_5000.py'
      - 'tmp_business_activity/enrich_licenses_5000.py'
      - '.github/workflows/tmp_business_activity_5000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run FNS/Rosstat first 5000
        run: python tmp_business_activity/enrich_5000.py
      - name: Show summary
        if: always()
        run: cat tmp_business_activity/output/summary.json || true
      - name: Upload base results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-activity-first-5000-base
          path: tmp_business_activity/output/
          if-no-files-found: warn
          retention-days: 2

  chz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run Chestny Znak first 5000
        run: python tmp_business_activity/enrich_chz_5000.py
      - name: Show summary
        if: always()
        run: cat tmp_business_activity/output_chz_5000/summary.json || true
      - name: Upload CHZ results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-activity-first-5000-chz
          path: tmp_business_activity/output_chz_5000/
          if-no-files-found: warn
          retention-days: 2

  licenses:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests beautifulsoup4
      - name: Run licenses first 5000
        run: python tmp_business_activity/enrich_licenses_5000.py
      - name: Show summary
        if: always()
        run: cat tmp_business_activity/output_licenses_5000/summary.json || true
      - name: Upload license results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-activity-first-5000-licenses
          path: tmp_business_activity/output_licenses_5000/
          if-no-files-found: warn
          retention-days: 2
