name: TMP source probe
on:
  push:
    branches: ['tmp/business-activity-enrichment']
    paths:
      - 'tmp_business_activity/source_probe.py'
      - '.github/workflows/tmp_source_probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python tmp_business_activity/source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-probe
          path: source_probe.json
          retention-days: 1
