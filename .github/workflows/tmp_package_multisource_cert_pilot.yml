name: TMP package multisource cert pilot

on:
  push:
    branches:
      - tmp/business-activity-enrichment
    paths:
      - .github/workflows/tmp_package_multisource_cert_pilot.yml
      - tmp_business_activity/multisource_cert_pilot.py
      - tmp_business_activity/test_multisource_cert_pilot.py
      - tmp_business_activity/secondary_gap_41.py
      - tmp_business_activity/missing_s34_41.txt
      - tmp_business_activity/requirements_fsa.txt
      - tmp_business_activity/inns_1000.part1
      - tmp_business_activity/inns_1000.part2
      - tmp_business_activity/inns_1000.part3
      - tmp_business_activity/inns_1000.part4

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build pilot package
        run: |
          mkdir -p multisource_pilot
          cp tmp_business_activity/multisource_cert_pilot.py multisource_pilot/
          cp tmp_business_activity/test_multisource_cert_pilot.py multisource_pilot/
          cp tmp_business_activity/secondary_gap_41.py multisource_pilot/
          cp tmp_business_activity/missing_s34_41.txt multisource_pilot/
          cp tmp_business_activity/requirements_fsa.txt multisource_pilot/requirements.txt
          cp tmp_business_activity/inns_1000.part1 multisource_pilot/
          cp tmp_business_activity/inns_1000.part2 multisource_pilot/
          cp tmp_business_activity/inns_1000.part3 multisource_pilot/
          cp tmp_business_activity/inns_1000.part4 multisource_pilot/
          cat > multisource_pilot/run_windows.bat <<'BAT'
          @echo off
          setlocal
          cd /d %~dp0
          py -m pip install -r requirements.txt
          if errorlevel 1 exit /b 1
          py -3.12 multisource_cert_pilot.py
          pause
          BAT
          cat > multisource_pilot/run_secondary_gap_windows.bat <<'BAT'
          @echo off
          setlocal
          cd /d %~dp0
          py -m pip install -r requirements.txt
          if errorlevel 1 exit /b 1
          py -3.12 secondary_gap_41.py
          pause
          BAT
          cat > multisource_pilot/README.txt <<'TXT'
          Pilot package.

          Main 100-company run:
            py -3.12 multisource_cert_pilot.py

          Secondary-gap run for the 41 INNs missed by S34 in the latest 100-company pilot:
            py -3.12 secondary_gap_41.py

          The secondary-gap script tests SOOTVETSTVIE first with strict target-INN
          verification and then List-Org. It does not bypass CAPTCHA.

          Original notes:
          Pilot: first 20 INNs across SOOTVETSTVIE.RUS, S-34 and List-Org.

          Windows:
            py -m pip install -r requirements.txt
            py -3.12 multisource_cert_pilot.py

          Or double-click run_windows.bat.

          Output:
            output_multisource_pilot\pilot_results.csv
            output_multisource_pilot\summary.json
            output_multisource_pilot\cache\...

          The script is intentionally slow and resumable.
          It does NOT bypass CAPTCHA. If List-Org shows anti-bot,
          that source is marked BLOCKED_CAPTCHA and skipped afterwards.

          Default pilot = first 20 INNs.
          To change in PowerShell:
            $env:PILOT_INNS="50"
            py -3.12 multisource_cert_pilot.py
          TXT
          python -m pip install -r multisource_pilot/requirements.txt
          python -m py_compile multisource_pilot/multisource_cert_pilot.py multisource_pilot/test_multisource_cert_pilot.py multisource_pilot/secondary_gap_41.py
          (cd multisource_pilot && python -m unittest -v test_multisource_cert_pilot.py)

      - uses: actions/upload-artifact@v4
        with:
          name: multisource-cert-pilot
          path: multisource_pilot/
          retention-days: 7
