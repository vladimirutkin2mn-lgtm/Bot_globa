name: HeartSignal Baseline CI

on:
  push:
    branches:
      - main
    paths:
      - "heartsignal/**"
      - ".github/workflows/heartsignal-ci.yml"
  pull_request:
    paths:
      - "heartsignal/**"
      - ".github/workflows/heartsignal-ci.yml"

concurrency:
  group: heartsignal-ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: heartsignal

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: heartsignal_test
          POSTGRES_USER: heartsignal
          POSTGRES_PASSWORD: heartsignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heartsignal -d heartsignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://heartsignal:heartsignal@localhost:5432/heartsignal_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: heartsignal/uv.lock

      - name: Fail if uv.lock is out of date with pyproject.toml
        run: uv lock --check

      - name: Install the exact locked dependency set
        run: uv sync --frozen --extra dev

      - name: Check formatting
        run: uv run ruff format --check app tests migrations scripts tools

      - name: Lint
        run: uv run ruff check app tests migrations scripts tools

      - name: Type-check
        run: uv run mypy app tests scripts

      - name: Validate Alembic migration chain
        env:
          DATABASE_URL: postgresql+asyncpg://heartsignal:heartsignal@localhost:5432/heartsignal_test
          TELEGRAM_BOT_TOKEN: 123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          CONTENT_ENCRYPTION_KEY: ci-only-key
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head

      - name: Reset test database after migration validation
        run: uv run python scripts/reset_test_database.py

      - name: Verify protected platform invariants
        run: uv run bash scripts/run_platform_invariants.sh --junitxml=platform-invariants-report.xml

      - name: Verify oracle safety regression gate
        run: uv run bash scripts/run_oracle_safety_gate.sh --junitxml=oracle-safety-report.xml

      - name: Verify oracle staging quality gate
        env:
          ORACLE_STAGING_EXPECTED_LLM_PROVIDER: stub
          ORACLE_STAGING_EXPECTED_LLM_MODEL: stub
        run: uv run bash scripts/run_oracle_staging_quality_gate.sh --junitxml=oracle-staging-quality-report.xml

      - name: Verify oracle limited-release controls gate
        run: uv run bash scripts/run_oracle_release_controls_gate.sh --junitxml=oracle-release-controls-report.xml

      - name: Reset test database before oracle quality observability gate
        run: uv run python scripts/reset_test_database.py

      - name: Verify oracle cost and quality observability gate
        run: uv run bash scripts/run_oracle_quality_observability_gate.sh --junitxml=oracle-quality-report.xml

      - name: Reset test database before full suite
        run: uv run python scripts/reset_test_database.py

      - name: Test
        run: uv run pytest --cov --cov-report=xml --junitxml=pytest-report.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heartsignal-test-reports
          path: |
            heartsignal/platform-invariants-report.xml
            heartsignal/oracle-safety-report.xml
            heartsignal/oracle-staging-quality-report.xml
            heartsignal/oracle-release-controls-report.xml
            heartsignal/oracle-quality-report.xml
            heartsignal/pytest-report.xml
            heartsignal/coverage.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare Compose environment
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag bot-globa:ci .
