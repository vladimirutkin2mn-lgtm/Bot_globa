name: TMP PB shards first 1000

on:
  push:
    branches:
      - tmp/business-activity-enrichment
    paths:
      - 'tmp_business_activity/pb_shard.py'
      - '.github/workflows/tmp_pb_shards.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pb-shard:
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run PB shard
        env:
          PB_PART: ${{ matrix.part }}
        run: python tmp_business_activity/pb_shard.py
      - name: Show summary
        if: always()
        run: cat tmp_business_activity/output_pb_part${{ matrix.part }}/summary_part${{ matrix.part }}.json || true
      - name: Upload shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pb-first1000-part-${{ matrix.part }}
          path: tmp_business_activity/output_pb_part${{ matrix.part }}/
          if-no-files-found: warn
          retention-days: 1
