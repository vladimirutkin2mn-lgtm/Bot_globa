name: Refresh uv lock (temporary)

on:
  push:
    branches:
      - agent/daily-share-card-v3
    paths:
      - "bot_globa/pyproject.toml"
      - ".github/workflows/refresh-uv-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/daily-share-card-v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.28"

      - name: Refresh lock file
        working-directory: bot_globa
        run: uv lock

      - name: Commit lock update
        run: |
          if git diff --quiet -- bot_globa/uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot_globa/uv.lock
          git commit -m "Refresh uv.lock for dynamic share cards"
          git push origin HEAD:agent/daily-share-card-v3
