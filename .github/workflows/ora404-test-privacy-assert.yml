name: ORA-404 privacy assertion fix

on:
  push:
    branches:
      - agent/ora-404-horoscope-persona-retry
    paths:
      - .github/workflows/ora404-test-privacy-assert.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Narrow raw birth field assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/tests/test_horoscope_generation.py')
          text = path.read_text()
          old = '    assert "birth_date" not in prompt\n    assert "birth_time" not in prompt\n'
          new = '    assert \'"birth_date":\' not in prompt\n    assert \'"birth_time":\' not in prompt\n'
          if old not in text:
              raise SystemExit('expected privacy assertions not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/tests/test_horoscope_generation.py
          git commit -m 'ORA-404: assert raw birth fields rather than limitation names'
          git push origin HEAD:agent/ora-404-horoscope-persona-retry
