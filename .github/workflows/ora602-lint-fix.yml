name: ORA-602 lint fix

# One-shot self-cleaning helper.
on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-lint-fix.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Fix ORA-602 lint issues and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/services/horoscope_generation.py')
          text = path.read_text()
          old = (
              'from app.domain.reading_generation import (\n'
              '    ReadingGenerationClaim,\n'
              '    ReadingGenerationClaimStatus,\n'
              '    ReadingGenerationFinalizeStatus,\n'
              ')\n'
          )
          new = (
              'from app.domain.reading_generation import (\n'
              '    ReadingGenerationClaim,\n'
              '    ReadingGenerationClaimStatus,\n'
              '    ReadingGenerationContext,\n'
              '    ReadingGenerationFinalizeStatus,\n'
              ')\n'
          )
          if text.count(old) != 1:
              raise SystemExit('expected Horoscope reading-generation import block once')
          path.write_text(text.replace(old, new, 1))
          PY
          cd heartsignal
          ruff check --fix \
            app/observability/oracle_quality.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py
          ruff format \
            app/observability/oracle_quality.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py
          ruff check \
            app/observability/oracle_quality.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/observability/oracle_quality.py \
            heartsignal/app/services/horoscope_generation.py \
            heartsignal/app/services/reading_generation.py
          git rm .github/workflows/ora602-lint-fix.yml
          git commit -m 'ORA-602: fix lint and Horoscope context typing'
          git push origin HEAD:agent/ora-602-cost-quality-observability
