name: ORA-404 restore horoscope domain

on:
  push:
    branches:
      - agent/ora-404-horoscope-persona-retry
    paths:
      - .github/workflows/ora404-restore-domain.yml

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Restore known-good domain and apply degree fix
        shell: bash
        run: |
          set -euo pipefail
          git show f1cc1497be5847c9fc5bc66431328dda3b8b43d7:heartsignal/app/domain/horoscope.py > heartsignal/app/domain/horoscope.py
          python - <<'PY'
          from pathlib import Path

          path = Path('heartsignal/app/domain/horoscope.py')
          text = path.read_text()
          old = '    r"\\b\\d{1,3}(?:[.,]\\d+)?\\s*(?:°|degrees?|deg\\.?|градус(?:а|ов)?)\\b",  # noqa: RUF001\n'
          new = '    r"\\b\\d{1,3}(?:[.,]\\d+)?\\s*(?:°|degrees?|deg\\.?|градус(?:а|ов)?)(?=$|[\\s,.;:!?])",  # noqa: RUF001\n'
          if old not in text:
              raise SystemExit('expected legacy degree regex not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cd heartsignal
          ruff format app/domain/horoscope.py
          ruff check app/domain/horoscope.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal/app/domain/horoscope.py
          git commit -m 'ORA-404: restore horoscope domain and degree guard'
          git push origin HEAD:agent/ora-404-horoscope-persona-retry
