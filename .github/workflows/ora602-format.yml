name: ORA-602 formatter

on:
  push:
    branches:
      - agent/ora-602-cost-quality-observability
    paths:
      - .github/workflows/ora602-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Apply CI formatter
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          ruff format \
            app/providers/analytics.py \
            app/services/admin_metrics.py \
            app/services/horoscope_generation.py \
            app/services/reading_generation.py \
            tests/test_oracle_quality_admin_postgres.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal
          git commit -m 'ORA-602: apply Ruff formatting'
          git push origin HEAD:agent/ora-602-cost-quality-observability
