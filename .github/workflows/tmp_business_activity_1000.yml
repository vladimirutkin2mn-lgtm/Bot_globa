name: TMP business activity first 1000

on:
  push:
    branches:
      - tmp/business-activity-enrichment
    paths:
      - 'tmp_business_activity/inns_1000.b64'
      - 'tmp_business_activity/enrich_1000.py'
      - '.github/workflows/tmp_business_activity_1000.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enrich1000:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip requests
      - name: Run first 1000
        run: python tmp_business_activity/enrich_1000.py
      - name: Show summary
        if: always()
        run: |
          ls -lah tmp_business_activity/output || true
          cat tmp_business_activity/output/summary.json || true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: business-activity-first-1000
          path: tmp_business_activity/output/
          if-no-files-found: warn
          retention-days: 1
