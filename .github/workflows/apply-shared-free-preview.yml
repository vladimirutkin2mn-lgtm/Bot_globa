name: Apply shared free preview entitlement

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/oracle-free-preview-entitlement'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply shared entitlement implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'expected one anchor in {path}: {old[:80]!r}')
              target.write_text(text.replace(old, new, 1))

          models = 'heartsignal/app/db/models.py'
          replace_once(
              models,
              '''        CheckConstraint(
                  "(free_preview_status = 'available' AND free_preview_analysis_id IS NULL "
