                  "(free_preview_status = 'reserved' AND free_preview_analysis_id IS NOT NULL "
                  "AND free_preview_used_at IS NULL) OR "
                  "(free_preview_status = 'consumed' AND free_preview_used_at IS NOT NULL)",
                  name="ck_users_free_preview",
              ),''',
              '''        CheckConstraint(
                  "(free_preview_status = 'available' AND free_preview_analysis_id IS NULL "
                  "AND free_preview_reading_id IS NULL AND free_preview_used_at IS NULL) OR "
                  "(free_preview_status = 'reserved' AND "
                  "((free_preview_analysis_id IS NOT NULL AND free_preview_reading_id IS NULL) OR "
                  "(free_preview_analysis_id IS NULL AND free_preview_reading_id IS NOT NULL)) "
                  "AND free_preview_used_at IS NULL) OR "
                  "(free_preview_status = 'consumed' AND free_preview_used_at IS NOT NULL)",
                  name="ck_users_free_preview",
              ),''',
          )
          replace_once(
              models,
              '''    free_preview_analysis_id: Mapped[UUID | None] = mapped_column(
                  ForeignKey(
                      "analyses.id",
                      ondelete="SET NULL",
                      use_alter=True,
                      name="fk_users_preview_analysis",
                  ),
                  nullable=True,
              )
              free_preview_used_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True))''',
              '''    free_preview_analysis_id: Mapped[UUID | None] = mapped_column(
                  ForeignKey(
                      "analyses.id",
                      ondelete="SET NULL",
                      use_alter=True,
                      name="fk_users_preview_analysis",
                  ),
                  nullable=True,
              )
              free_preview_reading_id: Mapped[UUID | None] = mapped_column(
                  ForeignKey(
                      "readings.id",
                      ondelete="SET NULL",
                      use_alter=True,
                      name="fk_users_preview_reading",
                  ),
                  nullable=True,
              )
              free_preview_used_at: Mapped[datetime | None] = mapped_column(DateTime(timezone=True))''',
          )

          Path('heartsignal/app/services/preview_entitlement.py').write_text('''"""Concurrency-safe one-time free preview entitlement shared by all products."""

from dataclasses import dataclass
from datetime import UTC, datetime
from enum import StrEnum
from uuid import UUID

from sqlalchemy import select
from sqlalchemy.ext.asyncio import AsyncSession, async_sessionmaker

from app.db.models import Analysis, User
from app.db.reading_models import Reading
from app.domain.reading import ReadingAccess, ReadingStatus


class PreviewOutcome(StrEnum):
    RESERVED = "reserved"
    ALREADY_RESERVED_SAME_ANALYSIS = "already_reserved_same_analysis"
    ALREADY_CONSUMED_SAME_ANALYSIS = "already_consumed_same_analysis"
    ALREADY_RESERVED_SAME_READING = "already_reserved_same_reading"
    ALREADY_CONSUMED_SAME_READING = "already_consumed_same_reading"
    CONSUMED = "consumed"
    RELEASED = "released"
    UNAVAILABLE = "unavailable"
    ANALYSIS_NOT_FOUND = "analysis_not_found"
    READING_NOT_FOUND = "reading_not_found"
    USER_NOT_FOUND = "user_not_found"
    NOT_READY = "not_ready"
    RELEASED_AFTER_FAILURE = "released_after_failure"
    RELEASED_AFTER_DELETION = "released_after_deletion"


class ReadingPreviewVisibility(StrEnum):
    PREVIEW = "preview"
    FULL = "full"
    LOCKED = "locked"
    PENDING = "pending"


@dataclass(frozen=True)
class PreviewState:
    status: str
    analysis_id: UUID | None
    reading_id: UUID | None


class PreviewEntitlementService:
    """Serialize the single free preview using the durable user row."""

    def __init__(self, sessions: async_sessionmaker[AsyncSession]) -> None:
        self._sessions = sessions

    async def get_preview_state(self, user_id: UUID) -> PreviewState | None:
        async with self._sessions() as session:
            user = await session.get(User, user_id)
            return (
                None
                if user is None
                else PreviewState(
                    user.free_preview_status,
                    user.free_preview_analysis_id,
                    user.free_preview_reading_id,
                )
            )

    async def reserve_preview(self, user_id: UUID, analysis_id: UUID) -> PreviewOutcome:
        async with self._sessions.begin() as session:
            user = await session.scalar(select(User).where(User.id == user_id).with_for_update())
            if user is None:
                return PreviewOutcome.USER_NOT_FOUND
            analysis = await session.scalar(
                select(Analysis).where(Analysis.id == analysis_id, Analysis.user_id == user_id)
            )
            if analysis is None:
                return PreviewOutcome.ANALYSIS_NOT_FOUND
            if user.free_preview_analysis_id == analysis_id:
                if user.free_preview_status == "reserved" and analysis.status in {
                    "deleted",
                    "failed",
                }:
                    self._make_available(user)
                    return (
                        PreviewOutcome.RELEASED_AFTER_DELETION
                        if analysis.status == "deleted"
                        else PreviewOutcome.RELEASED_AFTER_FAILURE
                    )
                return (
                    PreviewOutcome.ALREADY_CONSUMED_SAME_ANALYSIS
                    if user.free_preview_status == "consumed"
                    else PreviewOutcome.ALREADY_RESERVED_SAME_ANALYSIS
                )
            if analysis.status != "draft" or analysis.intake_step != "complete":
                return PreviewOutcome.NOT_READY
            if user.free_preview_status != "available":
                return PreviewOutcome.UNAVAILABLE
            user.free_preview_status = "reserved"
            user.free_preview_analysis_id = analysis_id
            user.free_preview_reading_id = None
            return PreviewOutcome.RESERVED

    async def reserve_reading_preview(self, user_id: UUID, reading_id: UUID) -> PreviewOutcome:
        async with self._sessions.begin() as session:
            user = await session.scalar(select(User).where(User.id == user_id).with_for_update())
            if user is None:
                return PreviewOutcome.USER_NOT_FOUND
            reading = await session.scalar(
                select(Reading).where(Reading.id == reading_id, Reading.user_id == user_id)
            )
            if reading is None:
                return PreviewOutcome.READING_NOT_FOUND
            if user.free_preview_reading_id == reading_id:
                if user.free_preview_status == "reserved" and reading.status in {
                    ReadingStatus.DELETED.value,
                    ReadingStatus.FAILED.value,
                }:
                    self._make_available(user)
                    return (
                        PreviewOutcome.RELEASED_AFTER_DELETION
                        if reading.status == ReadingStatus.DELETED.value
                        else PreviewOutcome.RELEASED_AFTER_FAILURE
                    )
                return (
                    PreviewOutcome.ALREADY_CONSUMED_SAME_READING
                    if user.free_preview_status == "consumed"
                    else PreviewOutcome.ALREADY_RESERVED_SAME_READING
                )
            if reading.status not in {ReadingStatus.DRAFT.value, ReadingStatus.FAILED.value}:
                return PreviewOutcome.NOT_READY
            if user.free_preview_status != "available":
                return PreviewOutcome.UNAVAILABLE
            user.free_preview_status = "reserved"
            user.free_preview_analysis_id = None
            user.free_preview_reading_id = reading_id
            return PreviewOutcome.RESERVED

    async def consume_preview(self, user_id: UUID, analysis_id: UUID) -> PreviewOutcome:
        return await self._transition_analysis(user_id, analysis_id, consume=True)

    async def finalize_preview(self, user_id: UUID, analysis_id: UUID) -> PreviewOutcome:
        """Consume the entitlement without ever downgrading durable report access."""
        async with self._sessions.begin() as session:
            user = await session.scalar(select(User).where(User.id == user_id).with_for_update())
            if user is None:
                return PreviewOutcome.USER_NOT_FOUND
            analysis = await session.scalar(
                select(Analysis)
                .where(Analysis.id == analysis_id, Analysis.user_id == user_id)
                .with_for_update()
            )
            if analysis is None:
                return PreviewOutcome.ANALYSIS_NOT_FOUND
            if analysis.status != "completed":
                return PreviewOutcome.NOT_READY
            if (
                user.free_preview_status != "reserved"
                or user.free_preview_analysis_id != analysis_id
            ):
                return PreviewOutcome.UNAVAILABLE
            if analysis.report_access != "full":
                analysis.report_access = "preview"
                analysis.cost_units = 0
                analysis.full_access_transaction_id = None
            self._consume(user)
            await session.flush()
            return PreviewOutcome.CONSUMED

    async def resolve_reading_visibility(
        self,
        user_id: UUID,
        reading_id: UUID,
    ) -> ReadingPreviewVisibility:
        """Finalize a reserved ready preview or return the durable paywall visibility."""
        async with self._sessions.begin() as session:
            user = await session.scalar(select(User).where(User.id == user_id).with_for_update())
            if user is None:
                return ReadingPreviewVisibility.LOCKED
            reading = await session.scalar(
                select(Reading)
                .where(Reading.id == reading_id, Reading.user_id == user_id)
                .with_for_update()
            )
            if reading is None:
                return ReadingPreviewVisibility.LOCKED
            if (
                reading.status == ReadingStatus.FULL_READY.value
                and reading.access_level == ReadingAccess.FULL.value
            ):
                if (
                    user.free_preview_status == "reserved"
                    and user.free_preview_reading_id == reading_id
                ):
                    self._make_available(user)
                return ReadingPreviewVisibility.FULL
            if user.free_preview_reading_id != reading_id:
                return ReadingPreviewVisibility.LOCKED
            if user.free_preview_status == "consumed":
                return (
                    ReadingPreviewVisibility.PREVIEW
                    if reading.status == ReadingStatus.PREVIEW_READY.value
                    else ReadingPreviewVisibility.LOCKED
                )
            if user.free_preview_status != "reserved":
                return ReadingPreviewVisibility.LOCKED
            if reading.status == ReadingStatus.PREVIEW_READY.value:
                self._consume(user)
                return ReadingPreviewVisibility.PREVIEW
            if reading.status in {ReadingStatus.FAILED.value, ReadingStatus.DELETED.value}:
                self._make_available(user)
                return ReadingPreviewVisibility.LOCKED
            return ReadingPreviewVisibility.PENDING

    async def release_preview(self, user_id: UUID, analysis_id: UUID) -> PreviewOutcome:
        return await self._transition_analysis(user_id, analysis_id, consume=False)

    async def release_reading_preview(self, user_id: UUID, reading_id: UUID) -> PreviewOutcome:
        async with self._sessions.begin() as session:
            user = await session.scalar(select(User).where(User.id == user_id).with_for_update())
            if user is None:
                return PreviewOutcome.USER_NOT_FOUND
            if (
                user.free_preview_reading_id != reading_id
                or user.free_preview_status != "reserved"
            ):
                return PreviewOutcome.UNAVAILABLE
            self._make_available(user)
            return PreviewOutcome.RELEASED

    async def _transition_analysis(
        self, user_id: UUID, analysis_id: UUID, *, consume: bool
    ) -> PreviewOutcome:
        async with self._sessions.begin() as session:
            user = await session.scalar(select(User).where(User.id == user_id).with_for_update())
            if user is None:
                return PreviewOutcome.USER_NOT_FOUND
            if (
                user.free_preview_analysis_id != analysis_id
                or user.free_preview_status != "reserved"
            ):
                return PreviewOutcome.UNAVAILABLE
            if consume:
                self._consume(user)
                return PreviewOutcome.CONSUMED
            self._make_available(user)
            return PreviewOutcome.RELEASED

    @staticmethod
    def _consume(user: User) -> None:
        user.free_preview_status = "consumed"
        user.free_preview_used_at = datetime.now(UTC)

    @staticmethod
    def _make_available(user: User) -> None:
        user.free_preview_status = "available"
        user.free_preview_analysis_id = None
        user.free_preview_reading_id = None
        user.free_preview_used_at = None
''')

          Path('heartsignal/app/services/reading_service.py').write_text('''"""Transactional application service for the independent Reading domain."""

from typing import Protocol
from uuid import UUID

from sqlalchemy.ext.asyncio import AsyncSession, async_sessionmaker

from app.db.reading_models import Reading
from app.domain.reading import ReadingDraftRequest, ReadingSymbolInput
from app.repositories.readings import ReadingSource, SqlAlchemyReadingRepository
from app.services.sensitive_content import SensitiveContentCipher


class PersonaUnavailableError(LookupError):
    """The requested persona does not exist or is disabled."""


class ReadingPreviewReleaseService(Protocol):
    async def release_reading_preview(self, user_id: UUID, reading_id: UUID) -> object: ...


class ReadingService:
    """Expose Reading use cases without Telegram, billing or provider coupling."""

    def __init__(
        self,
        sessions: async_sessionmaker[AsyncSession],
        cipher: SensitiveContentCipher,
        retention_days: int = 30,
        preview_entitlements: ReadingPreviewReleaseService | None = None,
    ) -> None:
        self._sessions = sessions
        self._cipher = cipher
        self._retention_days = retention_days
        self._preview_entitlements = preview_entitlements

    async def create_draft(self, user_id: UUID, request: ReadingDraftRequest) -> Reading:
        async with self._sessions.begin() as session:
            repository = self._repository(session)
            persona = await repository.enabled_persona(request.persona_code)
            if persona is None:
                raise PersonaUnavailableError("reading persona is unavailable")
            return await repository.create_draft(user_id, persona, request)

    async def start_generation(self, reading_id: UUID, user_id: UUID) -> Reading:
        async with self._sessions.begin() as session:
            return await self._repository(session).start_generation(reading_id, user_id)

    async def complete_preview(
        self,
        reading_id: UUID,
        user_id: UUID,
        result: dict[str, object],
        symbols: list[ReadingSymbolInput],
    ) -> Reading:
        async with self._sessions.begin() as session:
            return await self._repository(session).complete_generation(
                reading_id,
                user_id,
                result,
                symbols,
                full=False,
            )

    async def complete_full(
        self,
        reading_id: UUID,
        user_id: UUID,
        result: dict[str, object],
        symbols: list[ReadingSymbolInput],
        cost_units: int,
        transaction_id: UUID,
    ) -> Reading:
        await self.complete_preview(reading_id, user_id, result, symbols)
        return await self.promote_full_access(
            reading_id,
            user_id,
            cost_units,
            transaction_id,
        )

    async def promote_full_access(
        self,
        reading_id: UUID,
        user_id: UUID,
        cost_units: int,
        transaction_id: UUID,
    ) -> Reading:
        async with self._sessions.begin() as session:
            return await self._repository(session).promote_full_access(
                reading_id,
                user_id,
                cost_units,
                transaction_id,
            )

    async def fail_generation(self, reading_id: UUID, user_id: UUID, failure_code: str) -> Reading:
        async with self._sessions.begin() as session:
            return await self._repository(session).fail_generation(
                reading_id, user_id, failure_code
            )

    async def delete_owned(self, reading_id: UUID, user_id: UUID) -> Reading:
        async with self._sessions.begin() as session:
            reading = await self._repository(session).delete_owned(reading_id, user_id)
        if self._preview_entitlements is not None:
            await self._preview_entitlements.release_reading_preview(user_id, reading_id)
        return reading

    async def load_source(self, reading_id: UUID, user_id: UUID) -> ReadingSource | None:
        async with self._sessions() as session:
            return await self._repository(session).load_source(reading_id, user_id)

    async def load_result(self, reading_id: UUID, user_id: UUID) -> dict[str, object] | None:
        async with self._sessions() as session:
            return await self._repository(session).load_result(reading_id, user_id)

    def _repository(self, session: AsyncSession) -> SqlAlchemyReadingRepository:
        return SqlAlchemyReadingRepository(
            session,
            self._cipher,
            retention_days=self._retention_days,
        )
''')

          Path('heartsignal/app/services/tarot_reading.py').write_text('''"""Application use case for creating deterministic structured tarot previews."""

from dataclasses import dataclass
from typing import Protocol
from uuid import UUID

from app.db.reading_models import Reading
from app.domain.persona import PersonaDefinition, PersonaEngine, persona_definition
from app.domain.reading import ReadingDraftRequest
from app.domain.reading_generation import ReadingSymbolContext
from app.domain.tarot import THREE_CARD_SPREAD
from app.services.preview_entitlement import (
    PreviewOutcome,
    ReadingPreviewVisibility,
)
from app.services.reading_generation import (
    ReadingGenerationResult,
    ReadingGenerationService,
)
from app.services.reading_service import ReadingService
from app.services.symbolic_engine import SelectedTarotCard, TarotSymbolicEngine


class TarotConfigurationError(RuntimeError):
    """The deployed tarot persona and engine versions are incompatible."""


class UnsupportedTarotTopicError(ValueError):
    """The requested topic is not enabled for the tarot MVP."""


class TarotDraftService(Protocol):
    async def create_draft(self, user_id: UUID, request: ReadingDraftRequest) -> Reading: ...


class TarotGenerationService(Protocol):
    async def generate_preview(
        self,
        reading_id: UUID,
        user_id: UUID,
        symbol_contexts: tuple[ReadingSymbolContext, ...],
    ) -> ReadingGenerationResult: ...


class TarotPreviewEntitlement(Protocol):
    async def reserve_reading_preview(self, user_id: UUID, reading_id: UUID) -> PreviewOutcome: ...

    async def resolve_reading_visibility(
        self, user_id: UUID, reading_id: UUID
    ) -> ReadingPreviewVisibility: ...


@dataclass(frozen=True, slots=True)
class TarotPreviewRequest:
    topic: str
    question: str
    context: str | None = None


@dataclass(frozen=True, slots=True)
class TarotPreviewOutcome:
    reading_id: UUID
    spread_code: str
    cards: tuple[SelectedTarotCard, ...]
    generation: ReadingGenerationResult
    visibility: ReadingPreviewVisibility = ReadingPreviewVisibility.PREVIEW


class TarotReadingUseCase:
    """Create a reading and generate its deterministic three-card result."""

    persona_code = "tarot_reader"
    preview_spread_code = THREE_CARD_SPREAD.code

    def __init__(
        self,
        readings: TarotDraftService,
        generation: TarotGenerationService,
        engine: TarotSymbolicEngine | None = None,
        entitlements: TarotPreviewEntitlement | None = None,
    ) -> None:
        self._readings = readings
        self._generation = generation
        self._engine = engine or TarotSymbolicEngine()
        self._entitlements = entitlements
        self._persona = self._required_persona()

    @classmethod
    def from_services(
        cls,
        readings: ReadingService,
        generation: ReadingGenerationService,
        engine: TarotSymbolicEngine | None = None,
        entitlements: TarotPreviewEntitlement | None = None,
    ) -> "TarotReadingUseCase":
        """Production-friendly typed constructor without transport dependencies."""
        return cls(readings, generation, engine, entitlements)

    async def create_preview(
        self,
        user_id: UUID,
        request: TarotPreviewRequest,
    ) -> TarotPreviewOutcome:
        self._validate_topic(request.topic)
        reading = await self._readings.create_draft(
            user_id,
            ReadingDraftRequest(
                persona_code=self._persona.code,
                topic=request.topic,
                question=request.question,
                context=request.context,
                engine_version=self._engine.version,
                prompt_version=self._persona.prompt_version,
                schema_version=self._persona.schema_version,
                cost_units=0,
            ),
        )
        return await self.generate_existing_preview(reading.id, user_id)

    async def generate_existing_preview(
        self,
        reading_id: UUID,
        user_id: UUID,
    ) -> TarotPreviewOutcome:
        await self._reserve_if_possible(user_id, reading_id)
        cards = self._engine.draw(reading_id, self.preview_spread_code)
        generation = await self._generation.generate_preview(
            reading_id,
            user_id,
            self._symbol_contexts(cards),
        )
        visibility = (
            ReadingPreviewVisibility.PREVIEW
            if self._entitlements is None
            else await self._entitlements.resolve_reading_visibility(user_id, reading_id)
        )
        return TarotPreviewOutcome(
            reading_id=reading_id,
            spread_code=self.preview_spread_code,
            cards=cards,
            generation=generation,
            visibility=visibility,
        )

    async def _reserve_if_possible(self, user_id: UUID, reading_id: UUID) -> None:
        if self._entitlements is None:
            return
        outcome = await self._entitlements.reserve_reading_preview(user_id, reading_id)
        if outcome in {PreviewOutcome.USER_NOT_FOUND, PreviewOutcome.READING_NOT_FOUND}:
            raise LookupError("reading preview entitlement owner is unavailable")
        if outcome is PreviewOutcome.RELEASED_AFTER_FAILURE:
            await self._entitlements.reserve_reading_preview(user_id, reading_id)

    def _required_persona(self) -> PersonaDefinition:
        persona = persona_definition(self.persona_code)
        if persona is None:
            raise TarotConfigurationError("tarot persona is missing")
        if persona.engine is not PersonaEngine.SYMBOLIC:
            raise TarotConfigurationError("tarot persona must use a symbolic engine")
        if persona.schema_version != "reading-result-v1":
            raise TarotConfigurationError("tarot result schema is incompatible")
        return persona

    def _validate_topic(self, topic: str) -> None:
        if topic not in self._persona.supported_topics:
            raise UnsupportedTarotTopicError("unsupported tarot topic")

    @staticmethod
    def _symbol_contexts(
        cards: tuple[SelectedTarotCard, ...],
    ) -> tuple[ReadingSymbolContext, ...]:
        return tuple(
            ReadingSymbolContext(
                symbol=card.to_reading_symbol(),
                display_name=card.card.name_ru,
                interpretation_theme=card.interpretation_theme,
            )
            for card in cards
        )
