name: TMP FSA first 1000

on:
  workflow_dispatch:
  push:
    branches:
      - tmp/business-activity-enrichment
    paths:
      - tmp_business_activity/fsa.py
      - tmp_business_activity/enrich_fsa_1000.py
      - tmp_business_activity/test_fsa.py
      - tmp_business_activity/inns_1000.part1
      - tmp_business_activity/inns_1000.part2
      - tmp_business_activity/inns_1000.part3
      - tmp_business_activity/inns_1000.part4
      - .github/workflows/tmp_fsa_1000.yml

permissions:
  contents: read

jobs:
  fsa1000:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FSA_PROXY_URL: ${{ secrets.FSA_PROXY_URL }}
      FSA_TOKEN: ${{ secrets.FSA_TOKEN }}
      FSA_COOKIE: ${{ secrets.FSA_COOKIE }}
      FSA_TIMEOUT: "20"
      FSA_PAGE_SIZE: "100"
      FSA_MAX_DETAILS: "50"
      FSA_INN_DELAY: "0.15"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile FSA modules
        run: |
          python -m py_compile tmp_business_activity/fsa.py
          python -m py_compile tmp_business_activity/enrich_fsa_1000.py
          python -m py_compile tmp_business_activity/test_fsa.py

      - name: Run unit tests
        working-directory: tmp_business_activity
        run: python -m unittest -v test_fsa.py

      - name: Run FSA enrichment for first 1000
        run: python tmp_business_activity/enrich_fsa_1000.py

      - name: Show FSA summary
        if: always()
        run: |
          if [ -f tmp_business_activity/output_fsa_1000/summary.json ]; then
            cat tmp_business_activity/output_fsa_1000/summary.json
          fi

      - name: Upload FSA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsa-first-1000
          path: tmp_business_activity/output_fsa_1000/
          retention-days: 1
