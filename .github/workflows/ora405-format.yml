name: ORA-405 formatter

on:
  push:
    branches:
      - agent/ora-405-product-catalog-retry
    paths:
      - .github/workflows/ora405-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'ruff==0.16.1'
      - name: Apply CI formatter
        shell: bash
        run: |
          set -euo pipefail
          cd heartsignal
          ruff format \
            app/services/payment_service.py \
            tests/test_product_catalog_financial_lifecycle_postgres.py \
            tests/test_stripe_catalog_checkout.py \
            tests/test_yookassa_subscription_label_replay_postgres.py
          cd ..
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add heartsignal
          git commit -m 'ORA-405: apply Ruff formatting'
          git push origin HEAD:agent/ora-405-product-catalog-retry
